name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android SDK platform 34
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" || true

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Generate Gradle wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          /tmp/gradle-dist/gradle-8.6/bin/gradle wrapper --gradle-version 8.6
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee build-output.txt

      - name: Show build result
        if: always()
        run: |
          echo "### AAPT2 errors (raw)" >> $GITHUB_STEP_SUMMARY
          grep -n "aapt2\|error:\|^e: \|not found\|failed linking\|Aapt2\|w: \|CompilationError" build-output.txt \
            | grep -v "directory.*not found\|Caching disabled\|Downloading\|Transforming\|Daemon\|aapt2-proto\|aapt2-8\." \
            | head -60 >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tasks + failures" >> $GITHUB_STEP_SUMMARY
          grep -E "(> Task|FAILED|Caused by:|FAILURE:)" build-output.txt \
            | head -40 >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build output (last 100 lines)" >> $GITHUB_STEP_SUMMARY
          tail -100 build-output.txt >> $GITHUB_STEP_SUMMARY || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoordScanner-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: CoordScanner ${{ github.ref_name }}
          body: |
            ## CoordScanner ${{ github.ref_name }}

            APK для Android 8.0+ (API 26+)

            **Установка:** Скачай `app-debug.apk`, разреши установку из неизвестных источников, установи.
