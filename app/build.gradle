plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

def geminiKey = ""
def localProps = rootProject.file("local.properties")
if (localProps.exists()) {
    def props = new Properties()
    localProps.withInputStream { props.load(it) }
    geminiKey = props.getProperty("GEMINI_API_KEY", "")
}
if (geminiKey.isEmpty()) {
    geminiKey = System.getenv("GEMINI_API_KEY") ?: ""
}
println "GEMINI_API_KEY: length=${geminiKey.length()} present=${!geminiKey.isEmpty()}"

android {
    namespace 'com.coordscanner'
    compileSdk 34

    defaultConfig {
        applicationId "com.coordscanner"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "GEMINI_API_KEY", "\"${geminiKey}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    // AndroidX
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Material Design 3
    implementation 'com.google.android.material:material:1.11.0'

    // Room database
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // ML Kit Text Recognition (Latin + Cyrillic)
    implementation 'com.google.mlkit:text-recognition:16.0.0'

    // CameraX
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // OkHttp — HTTP клиент для Gemini Vision API
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // OSMDroid — карта OpenStreetMap (офлайн-тайлы)
    implementation 'org.osmdroid:osmdroid-android:6.1.17'

    // Glide — загрузка и кэширование изображений (для KMZ фото в InfoWindow)
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // AndroidSVG — рендеринг SVG иконок AlpineQuest
    implementation 'com.caverock:androidsvg-aar:1.4'

    // DocumentFile — SAF-доступ к папкам (Android 11+)
    implementation 'androidx.documentfile:documentfile:1.0.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
